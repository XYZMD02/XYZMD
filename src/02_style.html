        /* 抽牌选项组 */
        .d2-draw-options { width: 100%; max-width: 340px; flex-shrink: 0; }
        .d2-opt-group { display: none; }
        .d2-opt-group.d2-active { display: block; }
        .d2-opt-btns { display: flex; gap: 10px; justify-content: center; }
        .d2-opt-btns .d2-btn-start { flex: 1; max-width: 150px; }

        /* ===== 占卜对象选择 ===== */
        .d2-contact-area { width: 100%; margin: 10px 0; flex-shrink: 0; }
        .d2-contact-area label { font-size: 13px; color: #8a7a8a; letter-spacing: 1px; display: block; margin-bottom: 4px; }
        .d2-contact-select { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0; scrollbar-width: none; }
        .d2-contact-select::-webkit-scrollbar { display: none; }
        .d2-contact-chip {
            padding: 6px 14px; border-radius: 16px; font-size: 13px; cursor: pointer;
            white-space: nowrap; border: 1px solid #d8cee0; color: #8a7a8a;
            background: #fff; transition: all 0.2s; flex-shrink: 0;
        }
        .d2-contact-chip.d2-active { border-color: #8b7a9e; color: #8b7a9e; background: #f5f0f8; }

        /* ===== 问题输入 ===== */
        .d2-question-area { width: 100%; margin: 14px 0 10px; flex-shrink: 0; }
        .d2-question-area label { font-size: 13px; color: #8a7a8a; letter-spacing: 1px; display: block; margin-bottom: 4px; }
        .d2-question-area input {
            width: 100%; padding: 12px 14px; border: 1px solid #d8cee0; border-radius: 10px;
            background: #fff; font-size: 15px; font-family: inherit;
            color: #3a3040; outline: none; transition: border-color 0.2s;
        }
        .d2-question-area input:focus { border-color: #8b7a9e; }
        .d2-question-area input::placeholder { color: #b0a0b8; font-style: italic; }

        /* ===== 流程提示 ===== */
        .d2-flow-hint {
            width: 100%; display: flex; justify-content: flex-start;
            padding: 4px 4px 6px; font-size: 10px; color: #8a7a8a;
            letter-spacing: 0.5px; border-bottom: 1px solid #e8dcee; margin-bottom: 2px; flex-wrap: nowrap; gap: 2px; flex-shrink: 0; overflow-x: auto;
        }
        .d2-flow-hint .d2-step { display: flex; align-items: center; gap: 2px; flex-shrink: 0; white-space: nowrap; }
        .d2-flow-hint .d2-step .d2-dot { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: #d8cee0; margin-right: 1px; flex-shrink: 0; }
        .d2-flow-hint .d2-step.d2-active .d2-dot { background: #7b5a9b; box-shadow: 0 0 5px rgba(123,90,155,0.4); }
        .d2-flow-hint .d2-step.d2-done .d2-dot { background: #8b7a9e; }
        .d2-flow-hint .d2-arrow { color: #d8cee0; flex-shrink: 0; }

        .d2-btn-start {
            width: 100%; padding: 14px; border: 1px solid #8b7a9e; border-radius: 25px;
            background: linear-gradient(135deg, #f5f0f8, #faf5ff);
            color: #6a5a8a; font-size: 16px; font-weight: 600; font-family: inherit;
            letter-spacing: 3px; cursor: pointer; transition: 0.25s; margin: 4px 0 4px;
        }
        .d2-btn-start:active { transform: scale(0.97); background: #ede0f5; }
        .d2-btn-start:disabled { opacity: 0.4; pointer-events: none; }

        .d2-ornament { color: #d8cee0; font-size: 8px; letter-spacing: 4px; margin: 2px 0; }

        /* ===== 抽牌页面 ===== */
        .d2-draw-header {
            width: 100%; display: flex; align-items: center; justify-content: space-between;
            padding: 3px 0 4px; border-bottom: 1px solid #e8dcee; margin-bottom: 2px; flex-wrap: wrap; flex-shrink: 0;
        }
        .d2-draw-header .d2-back { font-size: 22px; cursor: pointer; padding: 2px 8px 2px 2px; color: #8a7a8a; transition: 0.2s; background: none; border: none; font-family: inherit; }
        .d2-draw-header .d2-back:active { transform: scale(0.9); color: #8b7a9e; }
        .d2-draw-header .d2-title { font-size: 16px; font-weight: 700; color: #8b7a9e; letter-spacing: 2px; flex: 1; text-align: center; }
        .d2-draw-header .d2-count { font-size: 12px; color: #8a7a8a; background: #f5f0f8; padding: 3px 12px; border-radius: 20px; letter-spacing: 1px; border: 1px solid #e8dcee; }

        .d2-draw-question { width: 100%; font-size: 12px; color: #8a7a8a; padding: 2px 0 4px; text-align: center; font-style: italic; border-bottom: 1px solid #e8dcee; margin-bottom: 4px; flex-shrink: 0; }
        .d2-draw-question strong { font-weight: 600; color: #8b7a9e; }

        /* ===== 抽牌舞台（填满剩余空间） ===== */
        .d2-draw-stage { width: 100%; flex: 1; display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start; min-height: 220px; padding: 4px 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }

        /* 洗牌动画 */
        .d2-shuffle-box { position: relative; width: 100%; height: 220px; display: flex; align-items: center; justify-content: center; }
        .d2-shuffle-card-fly {
            position: absolute; width: 62px; height: 96px;
            background: #faf7ff; border: 1.5px solid #8b7a9e; border-radius: 8px;
            box-shadow: 0 3px 12px rgba(140,120,160,0.12); transition: all 0.15s ease-out;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; color: #8b7a9e; will-change: transform, opacity; backface-visibility: hidden;
        }
        .d2-shuffle-card-fly.d2-back { background: #f5f0f8; border-color: #8b7a9e; }
        .d2-shuffle-card-fly.d2-back::after { content: '\2726'; color: #8b7a9e; font-size: 16px; opacity: 0.4; }

        /* ===== 牌轮展开 ===== */
        .d2-wheel-zone { position: absolute; left: 0; top: 0; width: 100%; height: 100%; touch-action: none; overflow: visible; z-index: 5; }
        .d2-wheel-scene { width: 100%; height: 100%; position: relative; overflow: visible; touch-action: none; }
        .d2-wheel-3d { position: absolute; left: 0; top: 0; width: 100%; height: 100%; touch-action: none; will-change: transform; }
        .d2-wheel-card {
            position: absolute; left: 0; top: 0; border-radius: 8px; cursor: pointer;
            will-change: transform, opacity; user-select: none; -webkit-user-select: none;
            transform-origin: center center; overflow: hidden;
            background: linear-gradient(135deg, #f5f0f8, #ede4f5, #f5f0f8);
            border: 2px solid #8b7a9e; display: flex; align-items: center; justify-content: center;
        }
        .d2-wheel-card::after { content: '\2726'; color: #8b7a9e; font-size: 15px; opacity: 0.35; }
        .d2-wheel-card.d2-used { pointer-events: none; }
        .d2-wheel-card.d2-front {
            z-index: 2000 !important; border-color: #8b7a9e;
            box-shadow: 0 0 24px rgba(140,120,160,0.35), 0 0 48px rgba(140,120,160,0.12);
        }
        .d2-wheel-card.d2-front::after { color: #8b7a9e; opacity: 0.7; animation: d2-frontGlow 2s ease-in-out infinite; }
        @keyframes d2-frontGlow { 0%,100% { opacity: 0.4; } 50% { opacity: 0.8; } }
        .d2-wheel-hint {
            position: absolute; bottom: 4px; left: 0; right: 0; text-align: center;
            font-size: 11px; color: #a090a8; letter-spacing: 1px; z-index: 10; pointer-events: none;
            animation: d2-hintPulse 2s ease-in-out infinite;
        }
        @keyframes d2-hintPulse { 0%,100% { opacity: 0.4; } 50% { opacity: 0.7; } }

        /* ===== 已抽出的牌 ===== */
        .d2-drawn-cards-area { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; width: 100%; padding: 3px 0; min-height: 40px; flex-shrink: 0; }

        /* ===== 两行牌网格 ===== */
        .d2-draw-pile-area { width: 100%; flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .d2-card-grid { width: 100%; display: flex; flex-direction: column; gap: 4px; padding: 0 2px; flex: 1; overflow: hidden; }
        .d2-card-row { display: flex; gap: 4px; overflow-x: auto; padding: 4px 2px; -webkit-overflow-scrolling: touch; scrollbar-width: none; flex: 1; align-items: center; min-height: 86px; }
        .d2-card-row::-webkit-scrollbar { display: none; }
        .d2-grid-card { flex-shrink: 0; width: 56px; height: 86px; border-radius: 6px; cursor: pointer; background: linear-gradient(135deg, #f5f0f8, #ede4f5, #f5f0f8); border: 2px solid #8b7a9e; display: flex; align-items: center; justify-content: center; transition: all 0.15s; position: relative; }
        .d2-grid-card::after { content: '\2726'; color: #8b7a9e; font-size: 15px; opacity: 0.4; }
        .d2-grid-card:active { transform: scale(0.88); border-color: #8b7a9e; box-shadow: 0 0 16px rgba(140,120,160,0.35); }
        .d2-grid-card.d2-used { opacity: 0.08; pointer-events: none; }
        .d2-pile-hint { text-align: center; font-size: 11px; color: #a090a8; letter-spacing: 1px; padding: 2px 0; flex-shrink: 0; }

        .d2-drawn-card-item { display: flex; flex-direction: column; align-items: center; width: 72px; animation: d2-cardReveal 0.5s ease-out; }
        @keyframes d2-cardReveal { 0% { transform: scale(0.3) rotateY(90deg); opacity: 0; } 60% { transform: scale(1.1) rotateY(0deg); opacity: 1; } 100% { transform: scale(1) rotateY(0deg); opacity: 1; } }
        .d2-drawn-card-item .d2-dc-img { position: relative; width: 64px; height: 100px; border-radius: 6px; overflow: hidden; box-shadow: 0 3px 10px rgba(140,120,160,0.12); background: #f5f0f8; }
        .d2-drawn-card-item .d2-dc-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .d2-drawn-card-item .d2-dc-img.d2-rev { transform: rotate(180deg); }
        .d2-drawn-card-item .d2-dc-name { font-size: 10px; color: #8b7a9e; text-align: center; margin-top: 2px; font-weight: 600; max-width: 68px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .d2-drawn-card-item .d2-dc-pos { font-size: 9px; font-weight: 600; margin-top: 1px; }
        .d2-drawn-card-item .d2-dc-pos.d2-up { color: #8b7a9e; }
        .d2-drawn-card-item .d2-dc-pos.d2-down { color: #c47080; }

        /* ===== 结果展示 ===== */
        #d2-resultArea { width: 100%; display: block; }
        .d2-result-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; width: 100%; padding: 3px 0; }
        .d2-result-card {
            background: #fff; border: 1px solid #e8dcee; border-radius: 6px;
            padding: 4px 4px 3px; width: calc(50% - 6px); max-width: 100px; text-align: center;
            box-shadow: 0 2px 6px rgba(140,120,160,0.05); transition: 0.3s; animation: d2-cardReveal 0.5s ease-out backwards;
        }
        .d2-result-card:nth-child(1) { animation-delay: 0.05s; }
        .d2-result-card:nth-child(2) { animation-delay: 0.15s; }
        .d2-result-card:nth-child(3) { animation-delay: 0.25s; }
        .d2-result-card:nth-child(4) { animation-delay: 0.35s; }
        .d2-result-card:nth-child(5) { animation-delay: 0.45s; }
        .d2-result-card:nth-child(6) { animation-delay: 0.55s; }
        .d2-result-card:nth-child(7) { animation-delay: 0.65s; }
        .d2-result-card .d2-rname { font-size: 12px; font-weight: 700; color: #8b7a9e; letter-spacing: 1px; }
        .d2-result-card .d2-rpos { font-size: 10px; font-weight: 600; margin-top: 1px; letter-spacing: 1px; }
        .d2-result-card .d2-rpos.d2-up { color: #8b7a9e; }
        .d2-result-card .d2-rpos.d2-down { color: #c47080; }
        .d2-result-card .d2-rnum { font-size: 8px; color: #b0a0b8; margin-top: 1px; letter-spacing: 0.5px; }

        .d2-result-card.d2-tarot-card { width: calc(50% - 6px); max-width: 105px; padding: 3px 3px 4px; }
        .d2-tarot-img-wrap { position: relative; width: 100%; aspect-ratio: 0.65; border-radius: 4px; overflow: hidden; box-shadow: 0 2px 6px rgba(140,120,160,0.06); transition: transform 0.3s; margin-bottom: 2px; background: #f5f0f8; }
        .d2-tarot-img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 5px; }
        .d2-img-reversed { transform: rotate(180deg); }
        .d2-tarot-img-wrap.d2-img-reversed::after { content: '\9006'; position: absolute; top: 4px; right: 4px; background: rgba(180,50,60,0.85); color: #fff; font-size: 9px; font-weight: 700; padding: 1px 6px; border-radius: 3px; letter-spacing: 1px; pointer-events: none; z-index: 2; }

        /* ===== 底部按钮 ===== */
        .d2-draw-actions { display: flex; gap: 10px; width: 100%; padding: 8px 0 2px; flex-wrap: wrap; justify-content: center; flex-shrink: 0; }
        .d2-btn {
            padding: 10px 24px; border: 1px solid #d8cee0; border-radius: 25px;
            font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer;
            transition: all 0.25s; letter-spacing: 1px; min-width: 110px; text-align: center;
            background: #fff; color: #8b7a9e;
        }
        .d2-btn:active { transform: scale(0.95); }
        .d2-btn-primary { background: linear-gradient(135deg, #f5f0f8, #faf5ff); color: #6a5a8a; border-color: #8b7a9e; }
        .d2-btn-primary:active { background: #ede0f5; }
        .d2-btn-outline { background: #fff; border-color: #d8cee0; color: #8a7a8a; }
        .d2-btn-outline:active { background: #f5f0f8; }
        .d2-btn:disabled { opacity: 0.3; pointer-events: none; }

        .d2-hidden { display: none !important; }
        .d2-text-center { text-align: center; }
        .d2-w-full { width: 100%; }

        /* ===== 免责声明 ===== */
        .d2-disclaimer-area { flex-shrink: 0; padding-bottom: 8px; }
        .d2-disclaimer { text-align: center; font-size: 8px; color: #b0a0b8; line-height: 1.4; padding: 2px 12px; letter-spacing: 0.5px; max-width: 380px; margin: 0 auto; }

        /* ===== 响应式 ===== */
        @media (min-width: 480px) {
            .d2-result-card { width: calc(33.33% - 6px); max-width: 90px; }
            .d2-result-card.d2-tarot-card { width: calc(33.33% - 6px); max-width: 100px; }
        }
        @media (max-width: 380px) {
            .d2-result-card { width: calc(50% - 4px); padding: 3px 3px; }
            .d2-result-card.d2-tarot-card { width: calc(50% - 4px); padding: 2px 2px 3px; }
            .d2-result-card .d2-rname { font-size: 11px; }
            .d2-home-title { font-size: 24px; }
            .d2-btn { padding: 8px 16px; font-size: 12px; min-width: 80px; }
            .d2-flow-hint { font-size: 10px; }
        }
/* ===== 生理周期样式 ===== */
.period-page {
  --period-bg: #faf8f6;
  --period-card: #ffffff;
  --period-rose: #d4788a;
  --period-rose-light: #f0e0e4;
  --period-rose-soft: #f8eff1;
  --period-text: #3a3035;
  --period-text-mid: #6b5e63;
  --period-text-sub: #a8989c;
  --period-border: #ede6e8;
  --period-shadow: 0 1px 3px rgba(58,48,53,0.04), 0 4px 16px rgba(58,48,53,0.05);
  --period-shadow-lg: 0 8px 32px rgba(58,48,53,0.08);
  --period-radius: 16px;
  --period-radius-sm: 12px;
  --period-radius-xs: 8px;
}
.period-page .period-app {
  width: 100%;
  max-width: 440px;
  padding: 20px 16px 40px;
}
.period-page .period-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 0 20px;
}
.period-page .period-header-brand {
  display: flex;
  align-items: center;
  gap: 8px;
}
.period-page .period-header-logo {
  width: 42px;
  height: 42px;
  border-radius: 14px;
  background: linear-gradient(135deg, #f0d8e0, #e8c4d0);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  box-shadow: 0 2px 8px rgba(212,120,138,0.15);
}
.period-page .period-header-title {
  font-family: "Noto Serif SC", "Source Han Serif SC", "SimSun", "STSong", "Songti SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  font-size: 22px;
  font-weight: 600;
  color: var(--period-text);
  letter-spacing: 0.5px;
}
.period-page .period-header-title span { color: var(--period-rose); }
.period-page .period-header-badge {
  font-size: 12px;
  font-weight: 500;
  padding: 6px 14px;
  border-radius: 20px;
  background: var(--period-rose-soft);
  color: var(--period-text-mid);
  display: flex;
  align-items: center;
  gap: 6px;
  letter-spacing: 0.3px;
}
.period-page .period-header-badge .period-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #c8b8bc;
  transition: 0.3s;
}
.period-page .period-header-badge .period-dot.on { background: var(--period-rose); animation: period-pulse-dot 2s ease-in-out infinite; }
@keyframes period-pulse-dot { 0%,100% { transform: scale(1); opacity: 0.6; } 50% { transform: scale(1.6); opacity: 1; } }
.period-page .period-status-card {
  background: var(--period-card);
  border-radius: var(--period-radius);
  padding: 20px;
  margin-bottom: 20px;
  box-shadow: var(--period-shadow);
  border: 1px solid var(--period-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.period-page .period-status-left .period-status-label {
  font-size: 12px;
  font-weight: 500;
  color: var(--period-text-sub);
  letter-spacing: 0.5px;
  text-transform: uppercase;
  margin-bottom: 4px;
}
.period-page .period-status-left .period-status-value {
  font-size: 17px;
  font-weight: 600;
  color: var(--period-text);
}
.period-page .period-status-right { text-align: right; }
.period-page .period-status-right .period-status-prediction {
  font-size: 13px;
  color: var(--period-text-mid);
  font-weight: 500;
}
.period-page .period-status-right .period-pred-label {
  font-size: 12px;
  color: var(--period-text-sub);
  display: block;
  margin-bottom: 2px;
}
.period-page .period-status-right .period-status-prediction strong {
  font-size: 26px;
  color: var(--period-rose);
  font-weight: 700;
  font-family: "Noto Serif SC", "Source Han Serif SC", "SimSun", "STSong", "Songti SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
}
.period-page .period-status-right .period-pred-unit {
  font-size: 13px;
  color: var(--period-text-sub);
  margin-left: 2px;
}
.period-page .period-status-right .period-pred-date {
  font-size: 12px;
  color: var(--period-text-sub);
  margin-top: 3px;
}
.period-page .period-cal-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
  padding: 0 4px;
}
.period-page .period-cal-nav .period-month-label {
  font-size: 16px;
  font-weight: 600;
  color: var(--period-text);
  font-family: "Noto Serif SC", "Source Han Serif SC", "SimSun", "STSong", "Songti SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  letter-spacing: 0.3px;
}
.period-page .period-cal-nav .period-nav-btns {
  display: flex;
  gap: 4px;
  align-items: center;
}
.period-page .period-cal-nav button {
  background: transparent;
  border: none;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  font-size: 14px;
  color: var(--period-text-mid);
  cursor: pointer;
  transition: 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: inherit;
  -webkit-tap-highlight-color: transparent;
}
.period-page .period-cal-nav button:active {
  background: var(--period-rose-soft);
  color: var(--period-rose);
}
.period-page .period-cal-nav .period-today-btn {
  width: auto;
  padding: 0 14px;
  font-size: 13px;
  font-weight: 500;
  background: var(--period-rose-soft);
  border-radius: 20px;
  color: var(--period-text-mid);
  height: 32px;
  letter-spacing: 0.2px;
}
.period-page .period-cal-nav .period-today-btn:active {
  background: var(--period-rose-light);
  color: var(--period-rose);
}
.period-page .period-calendar-wrap {
  background: var(--period-card);
  border-radius: var(--period-radius);
  padding: 14px 10px;
  margin-bottom: 16px;
  box-shadow: var(--period-shadow);
  border: 1px solid var(--period-border);
}
.period-page .period-calendar {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 2px;
}
.period-page .period-calendar .period-wd {
  text-align: center;
  font-size: 11px;
  font-weight: 600;
  color: var(--period-text-sub);
  padding: 6px 0 4px;
  letter-spacing: 0.2px;
}
.period-page .period-calendar .period-day {
  aspect-ratio: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  font-weight: 500;
  color: var(--period-text);
  border-radius: 50%;
  cursor: pointer;
  transition: 0.15s;
  position: relative;
  background: transparent;
  border: none;
  font-family: inherit;
  padding: 0;
  line-height: 1;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
