<script>
window.onerror=function(m,s,l,c,e){console.error('JS Error:',m,'at line',l);return true};

// 全局未捕获 Promise 异常处理，防止静默白屏
window.addEventListener('unhandledrejection',function(e){
  console.error('Unhandled rejection:',e.reason);
  // 防抖：同一错误在 1 秒内只处理一次，避免高频报错导致页面被反复重渲染、按钮失效
  var now=Date.now();
  if(window._lastUnhandledTs&&(now-window._lastUnhandledTs)<1000){
    e.preventDefault&&e.preventDefault();
    return;
  }
  window._lastUnhandledTs=now;
  // 隐藏早期加载动画
  try{var el=document.getElementById('early-loading');if(el)el.style.display='none';}catch(e3){}
  // 确保 phone 容器可见
  var phone=document.querySelector('.phone');
  if(phone && phone.style.opacity==='0'){
    phone.style.display='flex';
    phone.style.opacity='1';
  }
  var ann=document.getElementById('announcement-screen');
  if(ann && ann.style.display!=='none'){
    ann.style.opacity='0';
    setTimeout(function(){ann.style.display='none';ann.style.pointerEvents='none';},500);
  }
  try{showPg('pg-list');renderChatList();}catch(e2){}
});

// DOM 加载完成后确保 phone 最终可见（兜底机制）
document.addEventListener('DOMContentLoaded',function(){
  setTimeout(function(){
    var phone=document.querySelector('.phone');
    var ann=document.getElementById('announcement-screen');
    // 如果 5 秒后 phone 仍然不可见，强制显示
    setTimeout(function(){
      if(phone && (phone.style.opacity==='0' || phone.style.display==='none')){
        console.warn('Force showing phone after 5s timeout');
        try{var el=document.getElementById('early-loading');if(el)el.style.display='none';}catch(e3){}
        phone.style.display='flex';
        phone.style.opacity='1';
        if(ann){ann.style.display='none';ann.style.pointerEvents='none';}
        try{showPg('pg-list');renderChatList();}catch(e2){}
      }
    },5000);
    // 2 秒后也检查一次（兜底更快）
    setTimeout(function(){
      var elEarly=document.getElementById('early-loading');
      if(elEarly&&elEarly.style.display!=='none')return;
      if(phone && (phone.style.opacity==='0' || phone.style.display==='none')){
        console.warn('Force showing phone after 2s quick check');
        phone.style.display='flex';
        phone.style.opacity='1';
        if(ann){ann.style.display='none';ann.style.pointerEvents='none';}
        try{showPg('pg-list');renderChatList();}catch(e2){}
      }
    },2000);
  },0);
});

// 全局错误处理：确保发生 JS 错误时 phone 仍然可见
window.addEventListener('error',function(e){
  var phone=document.querySelector('.phone');
  if(phone && (phone.style.opacity==='0' || phone.style.display==='none')){
    console.warn('Global error caught, forcing phone display');
    phone.style.display='flex';
    phone.style.opacity='1';
    var ann=document.getElementById('announcement-screen');
    if(ann){ann.style.display='none';ann.style.pointerEvents='none';}
    try{showPg('pg-list');renderChatList();}catch(e2){}
  }
});

var $=function(id){return document.getElementById(id)};
var bindEvt=function(id,evt,fn){var el=$(id);if(el)el.addEventListener(evt,fn);};
var safeAddEvent=function(id,evt,fn,opts){var el=$(id);if(el){if(opts)el.addEventListener(evt,fn,opts);else el.addEventListener(evt,fn);}return !!el;};
var chatBgCache={};
var SELF='user',OTHER='partner',LC='ml2_c',LP='ml2_p',LM='ml2_m_',LD='ml2_d_',LL='ml2_letters',LMOM='ml2_moments',LLIKE='ml2_like_';
// 全局防误触：在touchend时用changedTouches计算总移动距离（而非touchmove中间值），
// 避免高灵敏度触屏（如荣耀100）在点击时产生微小touchmove导致误判为滑动
// 使用捕获阶段确保touchend在按钮的touchend之前触发
var _tsX=0,_tsY=0,_tsM=false;
document.addEventListener('touchstart',function(e){_tsX=e.touches[0].clientX;_tsY=e.touches[0].clientY;_tsM=false},{passive:true,capture:true});
function isSwipe(){return _tsM;}
document.addEventListener('touchend',function(e){
  var dx=e.changedTouches[0].clientX-_tsX;
  var dy=e.changedTouches[0].clientY-_tsY;
  _tsM=(Math.abs(dx)>20||Math.abs(dy)>20);
  if(_tsM){
    e.stopPropagation();
  }
},{passive:false,capture:true});
document.addEventListener('click',function(e){
  if(isSwipe()){
    _tsM=false;
    var tag=e.target.tagName;
    var hasOnclickAttr=!!e.target.closest('[onclick]');
    var hasJSOnclick=false;
    var el=e.target;
    for(var d=0;d<4&&el;d++){if(el.onclick){hasJSOnclick=true;break;}el=el.parentElement;}
    var isInteractive=tag==='BUTTON'||tag==='A'||tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||e.target.closest('button')||e.target.closest('a')||e.target.closest('.mo-action')||e.target.closest('[data-action]')||hasOnclickAttr||hasJSOnclick;
    if(!isInteractive){
      e.stopPropagation();
      e.preventDefault();
    }
  }
},true);

function setupKeyboardFix(){
  var isMobile=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
  if(!isMobile)return;
  
  var phone=document.querySelector('.phone');
  var msgbox=document.getElementById('msgbox');
  var inputWrap=document.querySelector('.input-wrap');
  
  var originalHeight=window.innerHeight;
  var vvHeight=window.innerHeight;
  
  if(window.visualViewport){
    var _vvResizeTimer=null;
    window.visualViewport.addEventListener('resize',function(){
      var newHeight=window.visualViewport.height;
      var heightDiff=originalHeight-newHeight;
      
      if(heightDiff>50){
        if(_vvResizeTimer)clearTimeout(_vvResizeTimer);
        _vvResizeTimer=setTimeout(function(){
          if(msgbox)msgbox.scrollTop=msgbox.scrollHeight;
        },100);
      }
    });
    
    // 移除scroll事件监听 - 每次滚动都强制scrollTop会导致严重卡顿
    // 仅在键盘弹出时通过resize事件处理滚动
  }
  
  window.addEventListener('resize',function(){
    var newHeight=window.innerHeight;
    var heightDiff=originalHeight-newHeight;
    
    if(heightDiff>50){
      if(msgbox){
        setTimeout(function(){msgbox.scrollTop=msgbox.scrollHeight},100);
      }
    }
  });
  
  document.addEventListener('focusin',function(e){
    if(e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT'){
      setTimeout(function(){
        if(msgbox){
          msgbox.scrollTop=msgbox.scrollHeight;
        }
      },300);
    }
  });
}
setupKeyboardFix();

", "kw": "成熟·宽容·情绪稳定", "desc": "情感的掌控者，宽容、沉稳，知道如何用成熟的方式去爱。", "rev_kw": "情绪勒索·冷漠·失控", "rev_desc": "为了控制他人而情感勒索，或者过于冷酷无情。"}, {"name": "宝剑王牌", "en": "Ace of Swords", "kw": "清晰·突破·真理", "desc": "一道劈开迷雾的闪电，真理和清晰的思维即将降临。", "rev_kw": "混乱·错误决策·模糊", "rev_desc": "思绪混乱如麻，无法做出正确的判断。"}, {"name": "宝剑二", "en": "Two of Swords", "kw": "僵局·逃避·防御", "desc": "闭着眼睛蒙蔽自己，拒绝做出选择。僵局需要打破。", "rev_kw": "释放真相·做出决定·打破僵局", "rev_desc": "终于鼓起勇气面对现实并做出决定。"}, {"name": "宝剑三", "en": "Three of Swords", "kw": "心碎·背叛·悲伤", "desc": "三把剑刺穿心脏，代表着不可回避的痛苦与真相大白。", "rev_kw": "疗愈·释怀·走出阴影", "rev_desc": "伤口正在愈合，你已慢慢学会释怀。"}, {"name": "宝剑四", "en": "Four of Swords", "kw": "休息·恢复·沉思", "desc": "战斗之后的休整。躺下来，彻底放松，恢复体力和精神。", "rev_kw": "失眠·焦虑·被迫休息", "rev_desc": "虽然休息了但毫无放松，反而更加焦躁不安。"}, {"name": "宝剑五", "en": "Five of Swords", "kw": "胜利的代价·冲突·空虚", "desc": "你赢了，但是代价惨重。这种以伤害他人为代价的胜利真的值得吗？", "rev_kw": "和解·放下·妥协", "rev_desc": "选择了退让或寻求和解，避免两败俱伤。"}, {"name": "宝剑六", "en": "Six of Swords", "kw": "过渡·前行·疗愈", "desc": "带着沉重的行李离开困境，向着平静的水面驶去。", "rev_kw": "被困·无法前进·拒绝帮助", "rev_desc": "困在原地，水底下暗流涌动，无法脱身。"}, {"name": "宝剑七", "en": "Seven of Swords", "kw": "策略·欺骗·智取", "desc": "通过巧妙的计谋拿走属于你的东西，但注意不要因为侥幸而翻车。", "rev_kw": "被识破·悔改·归还", "rev_desc": "诡计被识破，或者选择了坦白和归还。"}, {"name": "宝剑八", "en": "Eight of Swords", "kw": "束缚·限制·无力感", "desc": "感觉被禁闭和限制，但很多束缚其实是自我认知造成的，看看脚下，其实可以移动。", "rev_kw": "自由·解脱·清醒", "rev_desc": "突破了精神的枷锁，获得了全新的自由。"}, {"name": "宝剑九", "en": "Nine of Swords", "kw": "焦虑·噩梦·恐惧", "desc": "深夜的噩梦和极度的焦虑，让你彻夜难眠。事情可能没有你想的那么糟。", "rev_kw": "希望·走出恐惧·正视", "rev_desc": "终于开始正视恐惧，噩梦逐渐消散。"}, {"name": "宝剑十", "en": "Ten of Swords", "kw": "终结·谷底·绝处逢生", "desc": "最黑暗的时刻，被彻底击倒。但暴风雨已经过去，黎明就在眼前。", "rev_kw": "东山再起·坚强·幸存", "rev_desc": "克服了最后的苦难，正在艰难地站起来。"}, {"name": "宝剑侍从", "en": "Page of Swords", "kw": "好奇心·收集信息·警觉", "desc": "一个消息灵通者，正在收集和分析信息。保持警惕。", "rev_kw": "谣言·窥探·缺乏计划", "rev_desc": "散播未经证实的消息，或过度窥探隐私。"}, {"name": "宝剑骑士", "en": "Knight of Swords", "kw": "急进·冲撞·决心", "desc": "不顾一切地冲向目标，速度快但可能因为准备不足而至翻车。", "rev_kw": "鲁莽·混乱·挫败", "rev_desc": "横冲直撞导致惨痛的失败，全然听不进去别人的 var contacts=[],groups=[],me={name:'我',avatar:'',wxid:'',momentsCover:''},cid=null,rtimers={},typingStates={},currentProfileContactId=null,emotionStreak=0;
var cardPrivateContacts=[];
var _cardPrivateContactsReady=false; // ★ 标记 IndexedDB 恢复是否完成，防止自动检测竞态误判

function loadCardPrivateContacts(){
  return new Promise(function(resolve){
    try{
      var stored=localStorage.getItem('ml2_card_private_contacts');
      if(stored){
        try{cardPrivateContacts=JSON.parse(stored);}catch(e){cardPrivateContacts=[];}
      }
    }catch(e){
      cardPrivateContacts=[];
    }
    // 异步从 IndexedDB 恢复并合并，防止 localStorage 丢失导致绑定数据为空
    // ★ 修复：以 localStorage 为最新（保存是同步成功的），IndexedDB 只补充缺失项，
    // 避免 IndexedDB 旧数据（未绑定）覆盖 localStorage 新绑定
    var _done=function(){_cardPrivateContactsReady=true;resolve();};
    if(window.localforage){
      window.localforage.getItem('ml2_card_private_contacts').then(function(dbVal){
        try{
          if(dbVal){
            var dbData=typeof dbVal==='string'?JSON.parse(dbVal):dbVal;
            if(Array.isArray(dbData)&&dbData.length>0){
              // 以 localStorage 为准合并：localStorage 已有 id 保留（含最新绑定），IndexedDB 只补充缺失
              var merged=cardPrivateContacts.slice();
              var seen={};
              merged.forEach(function(pc){if(pc&&pc.id)seen[pc.id]=true;});
              var added=false;
              dbData.forEach(function(pc){
                if(pc&&pc.id&&!seen[pc.id]){seen[pc.id]=true;merged.push(pc);added=true;}
              });
              if(merged.length!==cardPrivateContacts.length){
                cardPrivateContacts=merged;
                try{localStorage.setItem('ml2_card_private_contacts',JSON.stringify(cardPrivateContacts));}catch(e){}
              }
              if(added)console.log('loadCardPrivateContacts: merged',added,'from IndexedDB');
            }
          }
        }catch(e){console.warn('loadCardPrivateContacts: IndexedDB merge failed',e);}
        _done();
      }).catch(function(e){
        console.warn('loadCardPrivateContacts: IndexedDB read failed',e);
        _done();
      });
    }else{
      _done();
    }
  });
}

function saveCardPrivateContacts(){
  try{
    var serialized=JSON.stringify(cardPrivateContacts);
    localStorage.setItem('ml2_card_private_contacts',serialized);
  }catch(e){}
  // 同步写入 IndexedDB，确保数据持久化不丢失；失败时重试一次
  if(window.localforage){
    window.localforage.setItem('ml2_card_private_contacts',serialized).then(function(){
      try{localStorage.setItem('ml2_card_private_contacts_synced',String(Date.now()));}catch(e){}
    }).catch(function(e){
      console.warn('saveCardPrivateContacts: IndexedDB save failed, retrying',e);
      setTimeout(function(){
        if(window.localforage){window.localforage.setItem('ml2_card_private_contacts',serialized).catch(function(){});}
      },500);
    });
  }
}
